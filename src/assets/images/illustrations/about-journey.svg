<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t">
  <title id="t">Illustration of NeuralArc's journey — a path from an idea to connected products, the cloud and success</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2FB"/>
      <stop offset="1" stop-color="#F8FBFE"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- Hills -->
  <path d="M0 470 q150-90 300-30 t300-20 t300-40 v220 h-900z" fill="#D6E6F7"/>
  <path d="M0 520 q200-60 420-10 t480-30 v120 h-900z" fill="#C3D8EF"/>

  <!-- Winding path -->
  <path d="M60 560 C 220 520, 160 430, 320 410 S 520 420, 560 330 S 700 230, 820 170" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <path d="M60 560 C 220 520, 160 430, 320 410 S 520 420, 560 330 S 700 230, 820 170" fill="none" stroke="#2A6EBB" stroke-width="4" stroke-dasharray="14 14" stroke-linecap="round"/>

  <!-- Milestone 1: idea -->
  <circle cx="120" cy="520" r="44" fill="#FFFFFF" stroke="#2A6EBB" stroke-width="5"/>
  <path d="M120 494 a18 18 0 0 1 11 32 v8 h-22 v-8 a18 18 0 0 1 11-32z" fill="#F6B93B"/>
  <rect x="110" y="538" width="20" height="6" rx="3" fill="#1E2A3A"/>

  <!-- Milestone 2: chip -->
  <circle cx="320" cy="410" r="44" fill="#FFFFFF" stroke="#2A6EBB" stroke-width="5"/>
  <rect x="300" y="390" width="40" height="40" rx="6" fill="#1E6B45"/>
  <rect x="310" y="400" width="20" height="20" rx="3" fill="#FFFFFF" opacity=".85"/>
  <g stroke="#1E2A3A" stroke-width="3" stroke-linecap="round">
    <path d="M308 384 v-6 M320 384 v-6 M332 384 v-6 M308 436 v6 M320 436 v6 M332 436 v6"/>
    <path d="M294 398 h-6 M294 410 h-6 M294 422 h-6 M346 398 h6 M346 410 h6 M346 422 h6"/>
  </g>

  <!-- Milestone 3: cloud -->
  <circle cx="560" cy="330" r="44" fill="#FFFFFF" stroke="#2A6EBB" stroke-width="5"/>
  <path d="M538 344 a14 14 0 0 1 2-28 a20 20 0 0 1 38-4 a14 14 0 0 1 4 32z" fill="#2A6EBB"/>

  <!-- Milestone 4: flag at the summit -->
  <circle cx="820" cy="170" r="50" fill="#E31C24"/>
  <rect x="808" y="140" width="5" height="62" rx="2.5" fill="#FFFFFF"/>
  <path d="M813 142 h34 l-10 12 l10 12 h-34z" fill="#FFFFFF"/>

  <!-- Walker -->
  <g transform="translate(430 372)">
    <circle cx="0" cy="-58" r="16" fill="#C98B5E"/>
    <path d="M-16 -60 q2-22 18-22 q18 0 16 18 q-10-8-20-6 q-8 2-14 10z" fill="#1E2A3A"/>
    <rect x="-16" y="-40" width="32" height="40" rx="8" fill="#E31C24"/>
    <path d="M-10 0 l-12 34 M10 0 l14 32" stroke="#1E2A3A" stroke-width="9" stroke-linecap="round"/>
    <path d="M-14 -34 l-16 22 M14 -34 l18 18" stroke="#E31C24" stroke-width="8" stroke-linecap="round"/>
    <rect x="-26" y="-40" width="14" height="30" rx="5" fill="#1F5AA0"/>
  </g>

  <!-- Sun, clouds and sparkles -->
  <circle cx="140" cy="110" r="46" fill="#F6B93B" opacity=".9"/>
  <path d="M330 120 a22 22 0 0 1 40-12 a18 18 0 0 1 30 14 a14 14 0 0 1-2 28 h-62 a16 16 0 0 1-6-30z" fill="#FFFFFF"/>
  <path d="M600 90 a18 18 0 0 1 32-10 a14 14 0 0 1 24 12 a12 12 0 0 1-2 22 h-50 a13 13 0 0 1-4-24z" fill="#FFFFFF"/>
  <g fill="#E31C24" opacity=".7">
    <path d="M720 300 l4 10 l10 4 l-10 4 l-4 10 l-4-10 l-10-4 l10-4z"/>
    <path d="M240 260 l3 8 l8 3 l-8 3 l-3 8 l-3-8 l-8-3 l8-3z"/>
  </g>
</svg>
